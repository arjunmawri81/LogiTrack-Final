services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: logitrack-backend

    restart: unless-stopped

    env_file:
      - ./backend/.env

    expose:
      - "5000"

    networks:
      - logitrack-network


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: logitrack-frontend

    restart: unless-stopped

    ports:
      - "8080:80"

    depends_on:
      - backend

    networks:
      - logitrack-network


networks:
  logitrack-network:
    driver: bridge